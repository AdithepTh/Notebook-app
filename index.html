<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b3240"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="สมุดเงิน">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><title>สมุดเงิน</title>
<style>
:root{--bg:#2b3240;--card:#363f50;--line:#47516a;--tx:#e4e7ee;--mu:#a2a9ba;--pink:#f2b5c4;--mint:#9ed9c5;--lav:#b9b6ef;--peach:#f4c690}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,"Sarabun",sans-serif}
main{max-width:560px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 14px 130px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:16px;margin:22px 0 8px;color:var(--mu);font-weight:600}
.card{background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.r{display:flex;justify-content:space-between;gap:10px;padding:5px 0}.r.sub{color:var(--mu);font-size:14px}
.r.big{font-size:19px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.mu{color:var(--mu);font-size:14px}.warn{color:var(--peach)}.ok{color:var(--mint)}.bad{color:var(--pink)}.lav{color:var(--lav)}
.badge{border-radius:99px;padding:2px 12px;font-size:14px;font-weight:600;background:#2b3240}
.tx{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}
.tx b{font-weight:600}.tx .a{white-space:nowrap;font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;align-items:center;background:#323a4b;
padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
nav button{flex:1;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;padding:4px 0}nav button span{display:block;font-size:20px}
nav button.on{color:var(--pink)}
nav .fab{flex:0 0 66px;height:66px;margin-top:-34px;border-radius:50%;background:var(--pink);color:#3a2f3c;font-size:36px;box-shadow:0 4px 14px #0005}
button.btn{width:100%;padding:15px;border:0;border-radius:16px;background:var(--pink);color:#3a2f3c;font:inherit;font-weight:700;margin-top:10px}
button.btn.alt{background:var(--line);color:var(--tx)}button.btn.del{background:none;color:var(--pink)}
input,select{width:100%;padding:13px;margin:5px 0;border-radius:14px;border:1px solid var(--line);background:#2b3240;color:var(--tx);font:inherit}
.two{display:flex;gap:8px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.seg button,.chip{padding:13px 6px;border-radius:14px;border:1px solid var(--line);background:#2b3240;color:var(--tx);font:inherit}
.seg button.on{background:var(--lav);color:#2d2b4a;border-color:var(--lav);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.chip{white-space:nowrap;padding:8px 14px;border-radius:99px}
.bg{position:fixed;inset:0;background:#0007}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
.prev{background:#2b3240;border-radius:12px;padding:8px 12px;color:var(--peach);font-size:14px;margin:6px 0}
.bar{height:7px;border-radius:4px;margin:2px 0}.mo{display:grid;grid-template-columns:44px 1fr 86px;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.nav2{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.nav2 button{background:var(--card);border:0;color:var(--tx);border-radius:12px;width:44px;height:44px;font-size:20px}
.lock{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center}.lock input{width:200px;text-align:center;font-size:28px;letter-spacing:8px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--mint);color:#1f3a30;padding:8px 18px;border-radius:99px;font-weight:600;z-index:9}
</style></head><body><div id="app"></div><script type="module" src="app.js"></script></body></html>
