<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b3240"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="คลังของฉัน">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png"><title>คลังของฉัน</title>
<style>
:root{--bg:#2b3240;--card:#363f50;--line:#47516a;--tx:#e4e7ee;--mu:#a2a9ba;--pink:#f2b5c4;--mint:#9ed9c5;--lav:#b9b6ef;--peach:#f4c690}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,"Sarabun",sans-serif}
header{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:12px;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;font-size:18px}
.burger{width:44px;height:44px;border:0;border-radius:12px;background:var(--card);color:var(--tx);font-size:22px}
main{max-width:720px;margin:auto;padding:4px 14px 120px}h2{font-size:15px;margin:18px 0 6px;color:var(--mu);font-weight:600}
aside{position:fixed;top:0;bottom:0;left:0;width:260px;z-index:6;background:#323a4b;border-right:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top)) 12px;overflow:auto;transform:translateX(-100%);transition:transform .2s}
.sb-open aside{transform:none}.brand{font-size:19px;font-weight:700;margin:0 8px 14px}
.mi{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);font:inherit;padding:13px 12px;border-radius:14px}.mi.on{background:var(--card);color:var(--pink);font-weight:600}
.bgm{display:none}.sb-open .bgm{display:block;position:fixed;inset:0;background:#0006;z-index:5}.content{transition:margin .2s}
@media(min-width:900px){.sb-open .content{margin-left:260px}.sb-open .bgm{display:none}}
.card{background:var(--card);border-radius:20px;padding:14px 16px;margin-bottom:12px}
.r{display:flex;justify-content:space-between;gap:10px;padding:5px 0}.r.sub{color:var(--mu);font-size:14px}.r.big{font-size:18px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.mu{color:var(--mu);font-size:14px}.ok{color:var(--mint)}.bad{color:var(--pink)}.warn{color:var(--peach)}
.tx{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.tx:last-child{border:0}.tx .a{white-space:nowrap;font-weight:600}
.ck{width:22px;height:22px;padding:0;margin:4px 6px 0 0;flex:none}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:0;background:var(--pink);color:#3a2f3c;font-size:34px;box-shadow:0 4px 14px #0006;z-index:4}
button.btn{width:100%;padding:14px;border:0;border-radius:16px;background:var(--pink);color:#3a2f3c;font:inherit;font-weight:700;margin-top:8px}
button.btn.alt{background:var(--line);color:var(--tx)}button.btn.del{background:none;color:var(--pink)}
input,select,textarea{width:100%;padding:13px;margin:5px 0;border-radius:14px;border:1px solid var(--line);background:#2b3240;color:var(--tx);font:inherit}
.two{display:flex;gap:8px}.seg3{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.seg3 button,.chip{padding:11px 4px;border-radius:14px;border:1px solid var(--line);background:#2b3240;color:var(--tx);font:inherit;font-size:13px}
.seg3 button.on,.chip.on{background:var(--lav);color:#2d2b4a;border-color:var(--lav);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.chips.wrap{flex-wrap:wrap;overflow:visible}.chip{white-space:nowrap;padding:8px 14px;border-radius:99px;font-size:14px}
.bg{position:fixed;inset:0;background:#0007;z-index:7}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;z-index:8;background:var(--card);border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-width:620px;margin:auto}
.prev{background:#2b3240;border-radius:12px;padding:8px 12px;color:var(--peach);font-size:14px;margin:6px 0}
.bar{height:7px;border-radius:4px;margin:2px 0}.nav2{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}.nav2 button{background:var(--card);border:0;color:var(--tx);border-radius:12px;width:44px;height:44px;font-size:20px}
table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--pink)}
.lock{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px}.lock input{width:200px;text-align:center;font-size:28px;letter-spacing:8px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--mint);color:#1f3a30;padding:8px 18px;border-radius:99px;font-weight:600;z-index:20}
.upd{position:fixed;left:12px;right:96px;bottom:calc(20px + env(safe-area-inset-bottom));background:var(--lav);color:#2d2b4a;border-radius:16px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;z-index:9;font-weight:600}.upd button{border:0;border-radius:12px;padding:8px 14px;background:#2d2b4a;color:var(--tx);font:inherit}
</style></head><body><div id="app"></div><script type="module" src="app.js"></script></body></html>
